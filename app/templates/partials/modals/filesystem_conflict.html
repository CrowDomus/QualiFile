<div class="modal fade" id="modal-conflict" tabindex="-1" aria-labelledby="modal-conflict-label" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="form-conflict">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modal-conflict-label">Resolve Conflicts</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-3">Select how to handle items when they already exist in <span class="fw-semibold" id="conflict-target"></span>.</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="conflict" id="conflict-rename" value="rename" checked>
                    <label class="form-check-label" for="conflict-rename">Auto-rename new items</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="conflict" id="conflict-overwrite" value="overwrite">
                    <label class="form-check-label" for="conflict-overwrite">Overwrite existing items</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="conflict" id="conflict-skip" value="skip">
                    <label class="form-check-label" for="conflict-skip">Skip items that already exist</label>
                </div>
                <div class="mt-3">
                    <label class="form-label" for="conflict-operation">Operation</label>
                    <select class="form-select" id="conflict-operation">
                        <option value="move">Move</option>
                        <option value="copy">Copy</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Apply</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="modal-delete" tabindex="-1" aria-labelledby="modal-delete-label" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="form-delete">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modal-delete-label">Confirm Deletion</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-3">The following items will be deleted:</p>
                <ul class="list-group mb-3" id="delete-list"></ul>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="delete-permanent">
                    <label class="form-check-label" for="delete-permanent">Delete permanently (bypass trash)</label>
                </div>
                <div class="alert alert-warning mt-3 d-none" id="delete-warning"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="modal-import" tabindex="-1" aria-labelledby="modal-import-label" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content" id="form-import" enctype="multipart/form-data">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modal-import-label">Import Structure from Template</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="import-file">Template (.txt)</label>
                        <input class="form-control" type="file" id="import-file" name="template" accept=".txt" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="import-destination">Destination folder</label>
                        <div class="input-group">
                            <input class="form-control" id="import-destination" name="destination" placeholder="." required>
                            <button class="btn btn-outline-secondary folder-picker-btn" type="button" data-folder-picker="import-destination">Browse</button>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">Folder names</label>
                    <div class="d-flex gap-3 flex-wrap" role="radiogroup">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="import-label-mode" id="import-label-full" value="full" checked>
                            <label class="form-check-label" for="import-label-full">Use full line text (e.g. 3.1 Documentation du projet)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="import-label-mode" id="import-label-numeric" value="numeric">
                            <label class="form-check-label" for="import-label-numeric">Use number only (e.g. 3.1)</label>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">Collision handling</label>
                    <div class="d-flex gap-3 flex-wrap" role="radiogroup">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="import-collision" id="import-collision-skip" value="skip" checked>
                            <label class="form-check-label" for="import-collision-skip">Skip existing</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="import-collision" id="import-collision-merge" value="merge">
                            <label class="form-check-label" for="import-collision-merge">Merge folders</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="import-collision" id="import-collision-rename" value="rename">
                            <label class="form-check-label" for="import-collision-rename">Auto-rename</label>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="h6 mb-0">Preview</h2>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-outline-secondary" id="import-refresh">Refresh preview</button>
                            <button type="button" class="btn btn-outline-primary" id="import-apply">Create structure</button>
                        </div>
                    </div>
                    <div class="mt-2 border rounded p-3 bg-body-tertiary" id="import-preview" style="min-height: 160px;">
                        <p class="text-muted mb-0">Upload a template to see the planned folders and files.</p>
                    </div>
                </div>
                <div class="alert alert-warning d-none mt-3" role="alert" id="import-warning"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </form>
    </div>
</div>

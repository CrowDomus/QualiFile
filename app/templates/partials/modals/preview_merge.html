<div
  class="modal fade"
  id="modal-merge"
  tabindex="-1"
  aria-labelledby="modal-merge-label"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="form-merge">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modal-merge-label">Merge Files</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Selected items</label>
          <ul class="list-group" id="merge-selected-list" aria-describedby="merge-help"></ul>
          <div class="form-text" id="merge-help">
            Use the arrow buttons to adjust order. Images can be merged into a PDF.
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="merge-output-name">Output filename</label>
            <input class="form-control" id="merge-output-name" name="output" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="merge-destination">Destination folder</label>
            <div class="input-group">
              <input
                class="form-control"
                id="merge-destination"
                name="destination"
                placeholder="."
                required
              />
              <button
                class="btn btn-outline-secondary folder-picker-btn"
                type="button"
                data-folder-picker="merge-destination"
              >
                Browse
              </button>
            </div>
          </div>
        </div>
        <hr />
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label" for="merge-mode">Merge mode</label>
            <select class="form-select" id="merge-mode" name="mode">
              <option value="pdf">Merge PDFs</option>
              <option value="images">Merge images into PDF</option>
            </select>
          </div>
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-paper">Paper size</label>
            <select class="form-select" id="merge-paper" name="paper">
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
            </select>
          </div>
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-orientation">Orientation</label>
            <select class="form-select" id="merge-orientation" name="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
        </div>
        <div class="row g-3 align-items-end mt-2">
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-margin">Margins (mm)</label>
            <input
              class="form-control"
              type="number"
              id="merge-margin"
              name="margin"
              min="0"
              max="50"
            />
          </div>
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-fit">Image fit</label>
            <select class="form-select" id="merge-fit" name="fit">
              <option value="contain">Contain</option>
              <option value="cover">Cover</option>
            </select>
          </div>
          <div class="col-md-4">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="merge-remember" checked />
              <label class="form-check-label" for="merge-remember">Remember these settings</label>
            </div>
          </div>
        </div>
        <div class="row g-3 align-items-end mt-2">
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-phrase-alignment">Phrase alignment</label>
            <select class="form-select" id="merge-phrase-alignment" name="phrase_alignment">
              <option value="left">Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>
          </div>
          <div class="col-md-4" data-merge-images-only="true">
            <label class="form-label" for="merge-phrase-font-size">Caption size (pt)</label>
            <select class="form-select" id="merge-phrase-font-size" name="phrase_font_size_pt">
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="24">24</option>
            </select>
          </div>
          <div class="col-md-4">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="merge-page-numbers" />
              <label class="form-check-label" for="merge-page-numbers">Include page numbers</label>
            </div>
          </div>
        </div>
        <div class="form-check mt-3" data-merge-images-only="true">
          <input class="form-check-input" type="checkbox" id="merge-phrases-toggle" />
          <label class="form-check-label" for="merge-phrases-toggle"
            >Add a phrase before each page</label
          >
        </div>
        <div class="mt-3 d-none" id="merge-phrases-container" data-merge-images-only="true">
          <div class="d-flex flex-wrap gap-2 mb-2">
            <button
              class="btn btn-sm btn-outline-secondary"
              type="button"
              id="merge-phrases-use-filenames"
            >
              Use filenames
            </button>
            <button class="btn btn-sm btn-outline-secondary" type="button" id="merge-phrases-clear">
              Clear all
            </button>
          </div>
          <div class="form-text mb-2">
            Leave blank to skip a page. Long phrases automatically wrap.
          </div>
          <div id="merge-phrases-list" class="d-flex flex-column gap-3"></div>
        </div>
        <div class="alert alert-warning d-none mt-3" role="alert" id="merge-warning"></div>
        <div class="tag-panel mt-3" id="merge-tag-section">
          <button
            class="btn btn-sm btn-outline-secondary mb-2"
            type="button"
            id="merge-tags-toggle"
            aria-expanded="false"
          >
            Show tags
          </button>
          <div id="merge-tag-panel" class="d-none">
            <label class="form-label">Tags (optional)</label>
            <div
              class="tag-picker"
              id="merge-tag-options"
              role="group"
              aria-label="Assign tags to output"
            ></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success">Merge</button>
      </div>
    </form>
  </div>
</div>

<div
  class="modal fade"
  id="modal-pdf-extract"
  tabindex="-1"
  aria-labelledby="modal-pdf-extract-label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <form class="modal-content" id="form-pdf-extract">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modal-pdf-extract-label">Extract pages</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="pdf-extract-source">Source PDF</label>
          <input class="form-control" id="pdf-extract-source" type="text" readonly />
        </div>
        <div class="mb-3">
          <label class="form-label" for="pdf-extract-pages">Pages to extract</label>
          <input
            class="form-control"
            id="pdf-extract-pages"
            type="text"
            placeholder="e.g. 1,3,4-6,9"
            aria-describedby="pdf-extract-pages-help"
          />
          <div class="form-text" id="pdf-extract-pages-help">
            Use commas and ranges (e.g. <code>1,3,4-6</code>).
          </div>
          <div class="invalid-feedback" id="pdf-extract-pages-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="pdf-extract-destination">Destination folder</label>
          <div class="input-group">
            <input class="form-control" id="pdf-extract-destination" type="text" placeholder="." />
            <button
              class="btn btn-outline-secondary"
              type="button"
              data-folder-picker="pdf-extract-destination"
            >
              Browse
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="pdf-extract-output">Output filename</label>
          <input
            class="form-control"
            id="pdf-extract-output"
            type="text"
            placeholder="extracted-pages.pdf"
          />
        </div>
        <div class="tag-panel mt-3" id="pdf-extract-tag-section">
          <button
            class="btn btn-sm btn-outline-secondary mb-2"
            type="button"
            id="pdf-extract-tags-toggle"
            aria-expanded="false"
          >
            Show tags
          </button>
          <div id="pdf-extract-tag-panel" class="d-none">
            <label class="form-label">Tags (optional)</label>
            <div
              class="tag-picker"
              id="pdf-extract-tag-options"
              role="group"
              aria-label="Assign tags to output PDF"
            ></div>
          </div>
        </div>
        <div class="alert alert-warning d-none" role="alert" id="pdf-extract-warning"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Extract pages</button>
      </div>
    </form>
  </div>
</div>

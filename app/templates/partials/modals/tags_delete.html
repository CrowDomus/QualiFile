<div class="modal fade" id="modal-tag-delete" tabindex="-1" aria-labelledby="modal-tag-delete-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-6" id="modal-tag-delete-label">Delete tag</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Are you sure you want to delete this tag?</p>
                <p class="fw-semibold mb-0" id="modal-tag-delete-name"></p>
                <p class="text-warning small mb-0 d-none" id="modal-tag-delete-children"></p>
                <p class="text-muted small mb-0">This will remove the tag from all files where it is assigned.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="modal-tag-delete-confirm">Delete tag</button>
            </div>
        </div>
    </div>
 </div>

<div class="modal fade" id="modal-project-file-picker" tabindex="-1" aria-labelledby="modal-project-file-picker-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modal-project-file-picker-label">Select file</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="fw-semibold text-truncate" id="project-file-picker-path" aria-live="polite"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="project-file-picker-up" aria-label="Go to parent folder">Up</button>
                </div>
                <div class="alert alert-danger d-none" id="project-file-picker-error" role="status"></div>
                <ul class="list-group" id="project-file-picker-list" role="listbox"></ul>
                <div class="alert alert-info mt-3 d-none" id="project-file-picker-empty" role="status">No files found.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-neutral" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="project-file-picker-select" disabled>Select</button>
            </div>
        </div>
    </div>
</div>

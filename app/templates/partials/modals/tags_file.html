<div class="modal fade" id="modal-file-tags" tabindex="-1" aria-labelledby="modal-file-tags-label" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="form-file-tags">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modal-file-tags-label">Edit categories</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">Selected item: <strong id="file-tag-target">---</strong></p>
                <div id="file-tag-options" class="tag-option-list"></div>
            </div>
            <div class="modal-footer flex-wrap gap-2">
                <button class="btn btn-outline-secondary me-auto" type="button" id="file-tags-manage">Manage tags</button>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                </div>
            </div>
        </form>
    </div>
</div>

name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall run.py app packaging tools

      - name: Validate app import
        run: |
          @'
          import os
          import tempfile

          os.environ["QUALIFILE_INSTANCE_PATH"] = tempfile.mkdtemp(prefix="qualifile-ci-")

          from app import create_app

          app = create_app()
          assert app.config["SERVER_HOST"] == "127.0.0.1"
          assert app.config["SERVER_PORT"] == 5000
          assert app.config["MAX_CONTENT_LENGTH"] == 104857600
          print(app.url_map)
          '@ | python -
